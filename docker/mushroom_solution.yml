# 基础配置模板
x-base: &base
  networks:
    - plant_backend
  environment:
    - TZ=Asia/Shanghai
    - ENVIRONMENT=${ENVIRONMENT:-production}
  restart: unless-stopped
  volumes:
    - /etc/localtime:/etc/localtime:ro  # 只读挂载主机时区
    - /etc/timezone:/etc/timezone:ro
  logging:
    driver: "json-file"
    options:
      max-size: "100m"
      max-file: "5"
      compress: "true"

# 应用服务模板
x-app-service: &app-service
  <<: *base
  pull_policy: if_not_present
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 120s

# 数据库依赖模板
x-db-deps: &db-deps
  depends_on:
    postgres_db:
      condition: service_healthy

# 服务定义（核心）
services:
  # PostgreSQL 数据库
  postgres_db:
    <<: *base
    image: pgvector/pgvector:pg18
    container_name: postgres_db
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB=${POSTGRES_DB:-mushroom_algorithm}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_SHARED_BUFFERS=128MB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=512MB
      - POSTGRES_MAINTENANCE_WORK_MEM=64MB
      - POSTGRES_MAX_CONNECTIONS=200
      - MLFLOW_DB=${MLFLOW_DB:-mlflow_db}
      - MLFLOW_DB_USER=${MLFLOW_DB_USER:-mlflow}
    secrets:
      - postgres_password
    volumes:
      - postgre_data_v18:/var/lib/postgresql
      - ./postgres_init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 1g
    cpus: 2.0
    user: "postgres:postgres"

  # 业务应用服务
  mushroom_solution:
    <<: [*app-service, *db-deps]
    image: "registry.cn-beijing.aliyuncs.com/ncgnewne/mushroom_solution:0.1.0-20260224180854-e4d3a2f"
    container_name: mushroom_solution
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - HF_HUB_DISABLE_TELEMETRY=1
      - TRANSFORMERS_OFFLINE=0
      - prod=True
      - DB_HOST=${POSTGRES_HOST:-postgres_db}
      - DB_PORT=${POSTGRES_PORT:-5432}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_NAME=${POSTGRES_DB:-mushroom_algorithm}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    volumes:
      - ./configs:/app/configs:ro
      - ./Logs:/app/Logs:rw
      - ./models:/models:rw
      - ./data:/app/data:rw
    #ports:
      #- "${STREAMLIT_PORT:-7005}:7005"
      #- 7009:5001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    mem_limit: 8g
    cpus: 4.0

  # MLflow 服务（极简脚本，无解析错误）
  mlflow:
    <<: *base
    build:
      context: ./mlflow_data
      dockerfile: Dockerfile
      args:
        - MLFLOW_VERSION=${MLFLOW_VERSION:-latest}
    container_name: mlflow
    depends_on:
      postgres_db:
        condition: service_healthy
    # 核心：所有环境变量从 .env 读取
    environment:
      # PostgreSQL 配置（从 .env 读取）
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres_db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${MLFLOW_DB_USER:-mlflow}
      - POSTGRES_PASSWORD=${MLFLOW_DB_PASSWORD:-eSePSPgpDQMMLtta}
      - POSTGRES_DB=${MLFLOW_DB:-mlflow_db}
      # MinIO/S3 配置（从 .env 读取，指向 mlflow-artifacts 桶）
      - MLFLOW_S3_ENDPOINT_URL=${MLFLOW_S3_ENDPOINT_URL}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_S3_VERIFY_SSL=${AWS_S3_VERIFY_SSL:-false}
      # MLflow 核心配置（从 .env 读取）
      - MLFLOW_HOST=${MLFLOW_HOST:-0.0.0.0}
      - MLFLOW_PORT=${MLFLOW_PORT:-5000}
      - MLFLOW_ARTIFACTS_DESTINATION=${MLFLOW_ARTIFACTS_DESTINATION}
      - MLFLOW_SERVER_ALLOWED_HOSTS=${MLFLOW_SERVER_ALLOWED_HOSTS:-*}
      - MLFLOW_SERVER_CORS_ALLOWED_ORIGINS=${MLFLOW_SERVER_CORS_ALLOWED_ORIGINS:-*}
      - MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE=${MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE:-true}
      # 时区/编码兜底
      - LC_ALL=zh_CN.UTF-8
      - LANG=zh_CN.UTF-8
      - PYTHONIOENCODING=utf-8
    secrets:
      - postgres_password
      - mlflow_db_password
    command: ["/app/start_mlflow.sh"]

     
    #ports:
      #- "${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:$$MLFLOW_PORT/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 2g
    cpus: 2.0
  caddy:
    <<: *base
    image: caddy:2-alpine
    container_name: caddy_proxy
    # 端口映射（外部访问）
    ports:
      - "5000:5000"    # MLflow
      - "7002:7002"    # mushroom_llama
      - "7005:7005"    # streamlit
      - "7009:7009"    # fastapi
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0

  # ---------- 巡检服务（导轨控制 + 采图调度 + prod 接收 API，ADR-0012） ----------
  #
  # 为什么带 profiles：这个服务用的镜像是**另外构建**的（docker/Dockerfile.patrol），
  # 不一定在 registry 里。带上 profile 之后，日常的 `docker compose up -d` 不会去拉它，
  # 因此巡检镜像还没准备好时，**算法侧的部署完全不受影响**；要起它得显式指定：
  #
  #     docker compose --profile patrol up -d mushroom_patrol
  #
  # 配置与数据放在**同级目录** ../mushroom_patrol/（与 mushroom_service/ 平级，Q18 的决定）
  mushroom_patrol:
    <<: *base
    profiles: ["patrol"]
    image: "${PATROL_IMAGE:-registry.cn-beijing.aliyuncs.com/ncgnewne/mushroom_patrol:0.1.0}"
    container_name: mushroom_patrol
    # 一轮约 11 分钟、每 3 小时由算法侧的调度器触发一次（ADR-0012 §6）。
    # 这里给的是"被触发时怎么跑"，不是自己的时刻表——自己排时刻表会让两边各有一套节奏。
    command: ["patrol-serve"]
    environment:
      - PROD_INGEST=${PROD_INGEST:-http://172.17.0.1:8000/ingest}
      # 采图服务发布在宿主上：容器里 127.0.0.1 不是宿主，必须走网桥网关
      - PATROL_CAPTURE_HOST=${PATROL_CAPTURE_HOST:-172.17.0.1:7003}
      - FMC4030_LIB_PATH=/opt/fmc-lib/libFMC4030_2009_1.so
    volumes:
      - ../mushroom_patrol/configs:/app/configs:ro
      - ../mushroom_patrol/data:/app/data:rw
      - ../mushroom_patrol/Logs:/app/Logs:rw
      # 厂商 SDK 动态库（与 capture 一样：运行时挂载，不打进镜像）
      - ../mushroom_patrol/lib:/opt/fmc-lib:ro
    healthcheck:
      # 巡检没有 HTTP 端口，用"进程还活着 + 日志可写"当健康判据
      test: ["CMD-SHELL", "test -w /app/Logs || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    # 导轨控制是单会话：绝不允许两个实例同时连着控制器
    deploy:
      replicas: 1
    mem_limit: 1g
    cpus: 2.0

  # 巡检台页面 + 只读接口（上位机从这里看状态与历史图）。
  # 同一个镜像、不同角色；**不接控制器**（巡检进行中它会刻意不连，见 deploy/console.py）。
  mushroom_console:
    <<: *base
    profiles: ["patrol"]
    image: "${PATROL_IMAGE:-registry.cn-beijing.aliyuncs.com/ncgnewne/mushroom_patrol:0.1.0}"
    container_name: mushroom_console
    command: ["console"]
    ports:
      # 上位机直接访问 http://<服务器IP>:8001/
      - "${CONSOLE_PORT:-8001}:8001"
    environment:
      - PATROL_ANALYSIS=${PATROL_ANALYSIS:-http://172.17.0.1:8000}
      - PATROL_CAPTURE_HOST=${PATROL_CAPTURE_HOST:-172.17.0.1:7003}
      # 算法侧的调度器打的地址（register_patrol_jobs.py 读同名环境变量）
      - PATROL_RUN_URL=${PATROL_RUN_URL:-http://mushroom_console:8001/api/patrol/run}
    volumes:
      # 只读挂配置与数据：console 不改任何东西
      - ../mushroom_patrol/configs:/app/configs:ro
      - ../mushroom_patrol/data:/app/data:ro
      - ../mushroom_patrol/Logs:/app/Logs:ro
      # ⚠️ 但这两处**协调文件**它必须能写（ADR-0011/0013 的文件通道，console 没有 SDK）：
      # data/trigger = 巡检触发请求；data/cmd = 手动指令 / 结果 / 会话 / ESTOP。
      # 子目录单独放 rw，父目录仍然 ro：outbox 与 runs/ 这些"证据"文件，console
      # 一个字节都改不了——这比"整棵 data 放开"更接近我们想要的那条线。
      - ../mushroom_patrol/data/trigger:/app/data/trigger:rw
      - ../mushroom_patrol/data/cmd:/app/data/cmd:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0

  # 巡检台**前端**：独立的静态产物（web/console/），与后端是两个可分别部署/回滚的东西。
  # 这一层同时也把"单一 origin"接回来：页面走 /，接口走 /api/ 转给 mushroom_console。
  #
  # 镜像是我们自建的（docker/Dockerfile.console-web：nginx + 打进去的 nginx.conf）——
  # 现场只依赖阿里云 registry 这一条交付通道，不必去 Docker Hub 拉 nginx。
  # **页面不打进镜像**：由下面的 bind mount 从宿主挂进去，改页面只需 scp 一次。
  mushroom_console_web:
    <<: *base
    profiles: ["patrol"]
    image: "${CONSOLE_WEB_IMAGE:-registry.cn-beijing.aliyuncs.com/ncgnewne/mushroom_console_web:0.1.0}"
    container_name: mushroom_console_web
    ports:
      # 上位机访问 http://<服务器IP>:8002/
      - "${CONSOLE_WEB_PORT:-8002}:80"
    volumes:
      # 页面产物放在巡检的部署目录下（与 configs/data/Logs/lib 同级）：
      # 上机时把仓库的 web/console/ 拷到 ../mushroom_patrol/web/
      - ../mushroom_patrol/web:/usr/share/nginx/html:ro
    depends_on:
      - mushroom_console
    healthcheck:
      # 用 curl：官方 nginx 镜像没有 wget，写 wget 会让容器永远 unhealthy（服务其实好的）
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 64m
    cpus: 0.5

# 数据卷（根级别，关键修复！）
volumes:
  postgre_data_v18:
    driver: local
  caddy_data:
    driver: local

# 网络（根级别）
networks:
  plant_backend:
    driver: bridge

# 密钥（根级别）
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  mlflow_db_password:
    file: ./secrets/mlflow_db_password.txt
[project]
name = "mushroom"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "comet>=3.1.0",
    "loguru>=0.7.3",
    "pandas>=2.3.0",
    "tqdm>=4.67.1",
    "ultralytics>=8.3.158",
    "wandb>=0.20.1",
]
[tool.uv.pip]
torch-backend = "auto"


[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
[project.optional-dependencies]
cpu = [
    "torch>=2.7.0",
]
cu128 = [
    "torch>=2.7.0",
]
[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu128" },
    ],
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
[dependency-groups]
dev = [
    "notebook>=7.2.2",
    "pyarmor>=9.0.6",
]

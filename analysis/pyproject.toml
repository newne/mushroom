[project]
name = "analysis"
version = "0.1.0"
description = "prod 侧服务：环控数据入库、生长×环境对齐分析、参数区间报表"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pandas>=2.2",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis"]

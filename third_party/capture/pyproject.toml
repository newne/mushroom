[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xcloudsdk-py"
version = "0.1.0"
description = "Python HTTP service wrapping XCloudSDK (ctypes) + MinIO uploads"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "boto3>=1.34",
]

[project.scripts]
xcloudsdk-py = "xcloudsdk_py.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

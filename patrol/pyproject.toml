[project]
name = "patrol"
version = "0.1.0"
description = "库房主机应用：FMC4030 运动控制 + 巡检调度 + 截图服务对接"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
patrol-debug = "patrol.debug:main"
patrol-teach = "patrol.teach:main"
patrol-migrate = "patrol.migrate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patrol"]

# 巡检台前端的 nginx：只做两件事——发静态页、把 /api/ 与 /healthz 转给后端。
#
# 为什么要有这一层（前后端分离之后仍然只有一个 origin）：
# 前端与后端是**两个独立产物**（可分别部署、分别回滚），但 ADR-0003 要求浏览器只认
# 一个 origin。这里用最薄的一层代理把两者接起来：页面走 /，接口走 /api/ 转到
# mushroom_console:8001。于是既不用在浏览器里配 API 地址，也不用开 CORS。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ⚠️ 必须用"变量 + resolver"的写法，不能让 nginx 在启动时把域名解析一次就缓存住。
    # 2026-09-15 上机实测：后端容器一重建（compose up -d 换了 IP），前端整片 502，
    # 而页面本身还正常——现场极易误判成"后端挂了"。放进变量后每次请求重新解析
    # （127.0.0.11 是 Docker 内嵌 DNS；本镜像只在 compose 网络里跑）。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $console http://mushroom_console:8001;

    # 页面本身不缓存：现场排障时"刷新了还是旧的"最费时间；
    # 静态资源将来加了指纹再单独放开缓存。
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 这个目录整体挂成站点根，所以开发用的脚本与 nginx 配置本身也在里面——
    # 别让它们被当成静态资源下载（dev.py 是本机开发用的，服务器上不需要）。
    location ~ \.(py|conf|md)$ {
        return 404;
    }

    # 后端接口：原样转发（保留 /api 前缀，后端就是按这个前缀注册的路由）。
    # 带变量的 proxy_pass **不会**自动带上原 URI，所以要自己拼 $request_uri
    # （它含查询串，状态页那些 ?station_id=… 就靠它）。
    location /api/ {
        proxy_pass $console$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        # 状态页每秒轮询一次，长连接省掉大量握手
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # 后端存活探针也放出来：在 :8002 上就能分开判断"页面在不在"与"后端在不在"。
    # 不加这条的话 /healthz 会被回落成 index.html——**200 但什么都没说**，最误导人。
    location = /healthz {
        proxy_pass $console/healthz;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }
}
